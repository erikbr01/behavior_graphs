# @package _global_
# Progress-estimation benchmark runner.
#
# Composes a collection of methods + metrics + a split + a dataset. Each method
# and metric is an independent _target_ config; the runner scores every method
# with every metric and writes report.md / metrics.json / *_curves.npz to `out`.
#
#   # graph methods (default) on libero_goal, aligned eval:
#   DATA_PATH=... python scripts/run_progress_bench.py data=libero_goal
#   # add a VLM baseline (needs the robometer venv + GPU):
#   ... +method/robometer_4b@methods.robometer_4b=robometer_4b
#   # drop a method / switch the K:
#   ... '~methods.graph_absorb' backbone.clustering.n_clusters=128
defaults:
  - /data@rollouts: all   # reuse the existing name->path dataset map
  - backbone: kmeans_identity
  - method/frame_index@methods.frame_index
  - method/graph_stage@methods.graph_stage
  - method/graph_absorb@methods.graph_absorb
  - metric/voc@metrics.voc
  - metric/kendall@metrics.kendall
  - metric/pearson@metrics.pearson
  - metric/mae@metrics.mae
  - metric/auroc@metrics.auroc
  - split: aligned
  - data: dataset
  - _self_

# Default dataset (override with data.name=<dataset in configs/data>).
data:
  name: libero_goal

# Output directory for report.md / metrics.json / *_curves.npz.
out: analysis/out/progress_bench

hydra:
  run:
    dir: ${out}/runs/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
