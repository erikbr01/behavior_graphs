# @package _global_
# Progress-estimation benchmark runner.
#
# Composes a collection of methods + metrics + a split + a dataset. Each method
# and metric is an independent _target_ config; the runner scores every method
# with every metric and writes report.md / metrics.json / *_curves.npz to `out`.
#
#   # graph methods (default) on libero_goal, aligned eval:
#   DATA_PATH=... python scripts/run_progress_bench.py data.name=libero_goal
#   # add a baseline (`+method@methods.<key>=<config>`):
#   ... +method@methods.mlp=mlp
#   # the paper's Tab. II row set, with the two VLMs (robometer venv + GPU):
#   ... '~methods.graph_absorb' '~methods.frame_index' \
#       +method@methods.mlp=mlp +method@methods.robometer_4b=robometer_4b \
#       +method@methods.topreward_ll=topreward_ll
#   # drop a method / switch the K:
#   ... '~methods.graph_absorb' backbone.clustering.n_clusters=128
defaults:
  - /data@rollouts: all   # reuse the existing name->path dataset map
  - backbone: kmeans_identity
  - method/frame_index@methods.frame_index
  - method/graph_stage@methods.graph_stage
  - method/graph_absorb@methods.graph_absorb
  - metric/voc@metrics.voc
  - metric/kendall@metrics.kendall
  - metric/pearson@metrics.pearson
  - metric/mae@metrics.mae
  - metric/auroc@metrics.auroc
  - split: aligned
  - data: dataset
  - _self_

# Default dataset (override with data.name=<dataset in configs/data>).
data:
  name: libero_goal

# Output directory for report.md / metrics.json / *_curves.npz.
out: analysis/out/progress_bench

hydra:
  # Loaded with config_path=configs/progress_estimation so that `method`,
  # `metric` and `split` are top-level groups a CLI override can name. The
  # shared configs/data map lives one level up, so put it on the search path
  # rather than reaching for it with an absolute default -- hydra prepends the
  # primary config's directory when resolving a group option, so a config_name
  # of `progress_estimation/bench` turns `+progress_estimation/method@...` into
  # a lookup for `progress_estimation/progress_estimation/method/...` and no
  # method can be added from the command line at all.
  searchpath:
    - file://${oc.env:BG_CONFIGS_ROOT}
  run:
    dir: ${out}/runs/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
