# Proprioception concatenated with the frozen DINOv3 embedding.
#
# The point of the arm: the embedding-only baseline is last by a wide margin
# and proprioception is first, so the question is whether vision adds anything
# *on top of* the kinematics or is simply worse at the same job. Neither
# single-representation arm can answer that.
#
# block_norm=l2 because the blocks are 14-d radians and a 9,216-d embedding;
# raw concatenation lets the embedding decide every distance and reproduces the
# dinov3 arm. See ConcatFeatures for why l2 rather than standardisation (no
# dataset statistics, so no leakage of held-out episodes) and for the
# dimensional imbalance it does not fix.
_target_: behavior_graphs.stages.features.concat.ConcatFeatures
block_norm: l2
extractors:
  - _target_: behavior_graphs.stages.features.state.StateFeatures
    key: state
  - _target_: behavior_graphs.stages.features.policy_embedding.PolicyEmbeddings
    layer: dinov3
