<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    font-family: "Source Sans Pro", -apple-system, system-ui, sans-serif;
    color: inherit;
    background: transparent;
  }
  #root { display: flex; flex-wrap: wrap; gap: 14px; }
  .card {
    flex: 1 1 0;
    min-width: 220px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    border: 1px solid rgba(250, 250, 250, 0.18);
    border-radius: 10px;
    padding: 10px;
    /* Colour only. A border that thickens on select shifts every other card by
       a pixel, which reads as the grid twitching under the pointer. */
    transition: border-color 90ms linear, background-color 90ms linear;
  }
  .card:hover { border-color: rgba(250, 250, 250, 0.4); }
  .card.on {
    border-color: #ff4b4b;
    background: rgba(255, 75, 75, 0.08);
  }
  .card video { width: 100%; border-radius: 6px; display: block; background: #000; }
  .pick { display: flex; align-items: center; gap: 8px; font-size: 0.94rem; }
  .pick input { accent-color: #ff4b4b; width: 17px; height: 17px; margin: 0; flex: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Hand-written rather than built with streamlit-component-lib, matching
// _subtask_editor/index.html: the protocol is three messages and this way the
// component is a single file with no build step in the repo.

function post(msg) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), "*");
}
function sendValue(v) {
  post({ type: "streamlit:setComponentValue", value: v, dataType: "json" });
}
let _lastH = 0;
function syncHeight() {
  const h = Math.ceil(document.getElementById("root").getBoundingClientRect().bottom) + 4;
  if (h !== _lastH) { _lastH = h; post({ type: "streamlit:setFrameHeight", height: h }); }
}

const S = { token: null, selected: null };

// The whole point of this component. One <input name> across the cards makes
// them one native radio group, so the browser unchecks the old card on the
// click rather than waiting for Python to say so. Three separate Streamlit
// radios cannot do that — no one of them knows the others exist — which cost
// about 300ms per switch. Inside this frame there is no React to fight: the
// DOM here *is* the state, and Python is told afterwards.
const GROUP = "pg-collection";

function build(args) {
  const root = document.getElementById("root");
  root.innerHTML = "";
  (args.views || []).forEach((view, i) => {
    const card = document.createElement("label");
    card.className = "card";
    card.dataset.option = view.option;

    const video = document.createElement("video");
    video.src = view.src;
    video.controls = true;
    video.preload = "metadata";
    if (view.poster) video.poster = view.poster;
    // Metadata arriving changes the intrinsic height, and the frame has to grow
    // with it or the last row is clipped.
    video.addEventListener("loadedmetadata", syncHeight);
    card.appendChild(video);

    const pick = document.createElement("div");
    pick.className = "pick";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = GROUP;
    input.value = view.option;
    input.checked = view.option === S.selected;
    // The click lands on the label, which is the whole card, so a participant
    // aiming at the clip selects it too.
    input.addEventListener("change", () => { if (input.checked) choose(view.option); });
    const text = document.createElement("span");
    text.textContent = view.option;
    pick.appendChild(input);
    pick.appendChild(text);
    card.appendChild(pick);

    root.appendChild(card);
  });
  paint();
  syncHeight();
}

function paint() {
  document.querySelectorAll(".card").forEach((card) => {
    card.classList.toggle("on", card.dataset.option === S.selected);
  });
}

function choose(option) {
  S.selected = option;
  paint();
  sendValue(option);
}

function render(args) {
  // Rebuild only when the clips themselves change. Any other rerun leaves the
  // <video> elements alone, so one that is playing keeps playing and none of
  // them re-fetches.
  const token = (args.views || []).map((v) => v.src).join("|");
  if (token !== S.token) {
    S.token = token;
    const seed = args.selected;
    S.selected = seed == null ? null : String(seed);
    build(args);
    return;
  }
  // args.selected is deliberately ignored here. While this frame is mounted the
  // selection lives in it, and Python is only told afterwards — so the render
  // that follows a click is still carrying the *previous* value: Python read
  // the new one from this component on the same run it sent these args. Adopting
  // it put the highlight back on the card the participant had just left, which
  // is the "it jumps to the one I clicked before" bug. Python seeds the
  // selection on mount and when the clips change, which is the branch above.
  syncHeight();
}

window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "streamlit:render") render(e.data.args || {});
});
window.addEventListener("resize", syncHeight);

post({ type: "streamlit:componentReady", apiVersion: 1 });
</script>
</body>
</html>
